[workspace]
members = [
    "cma-neural-network",
    "cma-cnn",
    "cma-autograd",
    "cma-models",
    "neural-wasm/shared",
    "neural-wasm/xor",
    "neural-wasm/mnist",
    "neural-wasm/mnist-lenet",
    "neural-wasm/mnist-alexnet",
    "neural-wasm/mnist-vgg",
    "neural-wasm/mnist-resnet",
    "neural-wasm/iris",
]
resolver = "2"

[package]
name = "test-neural"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "test-neural"
path = "src/main.rs"

[[example]]
name = "getting_started"
path = "examples/getting_started.rs"

[[example]]
name = "serialization"
path = "examples/serialization.rs"

[[example]]
name = "minibatch_demo"
path = "examples/minibatch_demo.rs"

[[example]]
name = "metrics_demo"
path = "examples/metrics_demo.rs"

[[example]]
name = "cnn_inference"
path = "examples/cnn_inference.rs"

[[example]]
name = "autograd_training"
path = "examples/autograd_training.rs"

[dependencies]
cma-neural-network = { path = "cma-neural-network" }
cma-cnn             = { path = "cma-cnn" }
cma-autograd        = { path = "cma-autograd" }
neural-wasm-shared  = { path = "neural-wasm/shared" }
ndarray = { version = "0.17.1", features = ["serde"] }
rand = "0.9.2"
serde_json = "1.0"
