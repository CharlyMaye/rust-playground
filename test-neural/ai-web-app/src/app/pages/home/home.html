<!-- About section -->
<app-about />

<!-- Demo cards grid -->
<div class="demo-grid" aria-label="Available neural network demos">
  @for (demo of demos(); track demo.route) {
    <app-demo-card
      [route]="demo.route"
      [icon]="demo.icon"
      [name]="demo.name"
      [fallbackName]="demo.fallbackName"
      [description]="demo.description"
      [fallbackDescription]="demo.fallbackDescription"
      [isLoading]="demo.isLoading"
      [loadingMessage]="demo.loadingMessage"
      [inputBadge]="demo.inputBadge"
      [outputBadge]="demo.outputBadge"
      [accuracy]="demo.accuracy"
      [showNotTrained]="demo.showNotTrained"
      [customBadge]="demo.customBadge"
      [customBadgeType]="demo.customBadgeType ?? 'warning'"
    />
  }
</div>
