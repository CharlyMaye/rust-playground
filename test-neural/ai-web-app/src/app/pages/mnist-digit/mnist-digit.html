@if (isLoading()) {
  <app-loader id="loading" [message]="'Loading Neural Network...'" />
} @else {
  <!-- Interactive Predictor -->
  <div class="card">
    <div class="card-header">
      <h2 class="card-title">Draw a Digit (0-9)</h2>
      <p class="card-subtitle">
        Draw a digit in the canvas below and see the neural network predict it
      </p>
    </div>

    <div class="predictor-container">
      <app-canvas-draw
        [gridSize]="{ rows: 28, cols: 28 }"
        (dataChanged)="onDrawingChanged($event)"
      />

      <div class="prediction-result">
        <div class="prediction-value">{{ predictionDisplay() }}</div>
        <div class="prediction-confidence">{{ confidenceDisplay() }}</div>
      </div>
    </div>
  </div>

  <!-- Network Visualization (using new configurable component with mnist preset) -->
  <div class="card visualization-card">
    <div class="card-header">
      <h2 class="card-title">Network Architecture</h2>
      <p class="card-subtitle">
        MNIST network: 784 input (28×28 heatmap) → hidden layers (bars) → 10 output neurons
      </p>
    </div>
    <app-configurable-network
      [architecture]="networkArchitecture()"
      [weights]="networkWeights()"
      preset="mnist"
      [debug]="false"
    />
  </div>

  <!-- Model Info -->
  <app-model-info [modelInfo]="modelInfo()" />
}
