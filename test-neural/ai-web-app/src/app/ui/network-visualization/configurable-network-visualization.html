@if (renderData()) {
  <canvas
    #networkCanvas
    class="network-canvas"
    [style.width.px]="canvasDimensions().width"
    [style.height.px]="canvasDimensions().height"
    (click)="onCanvasClick($event)"
    role="img"
    aria-label="Neural network visualization"
  ></canvas>
} @else {
  <p class="empty-state">No network data available</p>
}
