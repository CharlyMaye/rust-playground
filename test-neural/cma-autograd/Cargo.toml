[package]
name = "cma-autograd"
version = "0.1.0"
edition = "2024"
description = "Automatic differentiation engine for neural networks in Rust"
license = "MIT"

[lib]
name = "cma_autograd"
path = "src/lib.rs"

[features]
default = []
# Enable weight export to cma-cnn format
export = []

[dependencies]
cma-neural-network = { path = "../cma-neural-network" }
cma-cnn = { path = "../cma-cnn" }
ndarray = { version = "0.17.1", features = ["serde"] }
rand = "0.9.2"
