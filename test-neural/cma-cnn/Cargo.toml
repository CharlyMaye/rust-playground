[package]
name = "cma-cnn"
version = "0.1.0"
edition = "2024"
description = "Convolutional Neural Network layers for cma-neural-network"
license = "MIT"

[lib]
name = "cma_cnn"
path = "src/lib.rs"

[features]
default = []
# Enable parallel operations with Rayon (not compatible with WASM)
parallel = ["rayon"]

[dependencies]
cma-neural-network = { path = "../cma-neural-network" }
ndarray = { version = "0.17.1", features = ["serde"] }
rand = "0.9.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = { version = "1.10", optional = true }
