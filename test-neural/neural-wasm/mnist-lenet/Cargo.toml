[package]
name = "neural-wasm-mnist-lenet"
version = "0.1.0"
edition = "2021"
description = "LeNet-5 CNN for MNIST - WebAssembly module"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "train_lenet"
path = "src/train_lenet.rs"
# Don't link with lib.rs - standalone binary
required-features = ["training"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
neural-wasm-shared = { path = "../shared" }
cma-neural-network = { path = "../../cma-neural-network" }
cma-cnn = { path = "../../cma-cnn" }
cma-models = { path = "../../cma-models" }
ndarray = { version = "0.17.1", features = ["serde"] }
bincode = "1.3"
console_error_panic_hook = { version = "0.1", optional = true }

# Required for WASM random number generation
getrandom = { version = "0.3", features = ["wasm_js"] }
csv = { version = "1.3", optional = true }
chrono = { version = "0.4", optional = true }

[features]
default = ["console_error_panic_hook"]
# Training feature enables CSV loading, chrono, and parallel processing
training = ["csv", "chrono", "cma-cnn/parallel", "cma-neural-network/parallel"]

[profile.release]
opt-level = "s"
lto = true
