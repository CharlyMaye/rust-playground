[package]
name = "neural-wasm-mnist-resnet"
version = "0.1.0"
edition = "2021"
description = "ResNet-Micro CNN for MNIST - WebAssembly module"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "train_resnet"
path = "src/train_resnet.rs"
required-features = ["training"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
neural-wasm-shared = { path = "../shared" }
cma-neural-network = { path = "../../cma-neural-network" }
cma-cnn = { path = "../../cma-cnn" }
ndarray = { version = "0.17.1", features = ["serde"] }
bincode = "1.3"
console_error_panic_hook = { version = "0.1", optional = true }
csv = { version = "1.3", optional = true }
chrono = { version = "0.4", optional = true }

getrandom = { version = "0.3", features = ["wasm_js"] }

[features]
default = ["console_error_panic_hook"]
training = ["csv", "chrono"]

[profile.release]
opt-level = "s"
lto = true
